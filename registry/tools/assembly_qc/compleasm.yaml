id: compleasm
name: compleasm
version: "0.2.9"
category: assembly_qc
stage: [genome_assembly.step3]
input_types: [assembly_fasta]
output_types: [busco_report, completeness_summary]
applicable:
  species: [any]
  read_type: [any]
  mode: [any]
container:
  image: quay.io/biocontainers/compleasm:0.2.9--pyhdfd78af_0
  pull_policy: if_not_present
  image_digest: sha256:e815cefcc56e83648c70a10943e0e78ac54f6709289ad9c6b2fd05849db78802
resources:
  min: {cpu: 4, ram_gb: 8, disk_gb: 20}
  recommended: {cpu: 32, ram_gb: 32, disk_gb: 100}
  gpu: false
  arch: [x86_64, amd64]
command_template: |
  compleasm run -a {assembly_fasta} -o {out_dir}
                -l {busco_lineage} -L {busco_db} -t {cpu}
references: []
citation: "Huang & Li 2023, PMID 37758247"
added: "2026-05-15"
last_reviewed: "2026-07-30"
source_repo: huangnengCSU/compleasm
