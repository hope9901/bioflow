[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name.  The PyPI namespace `bioflow` is held by an
# unrelated 2018 project (Andrei Kucharavy's "BioFlow — Information
# Flow Analysis"), so we ship under `bioflowkit`.  The Python import
# name and the CLI command remain `bioflow` — only the `pip install`
# argument changes.
name = "bioflowkit"
version = "0.3.1"
description = "bioflow: one-line comparative-genomics recipes + Tier-A SDK, orchestrated over per-tool Docker BioContainers."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "bioflow", email = "hope9901@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "docker>=7.1",
    "psutil>=5.9",
    "questionary>=2.0",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pynvml>=11.5; platform_system == 'Linux'",
]

[project.urls]
"Homepage" = "https://github.com/hope9901/bioflow"
"Repository" = "https://github.com/hope9901/bioflow"
"Bug Tracker" = "https://github.com/hope9901/bioflow/issues"
"Changelog" = "https://github.com/hope9901/bioflow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Type stubs so mypy actually checks these libs instead of blanket-ignoring
    # every un-stubbed import (see [tool.mypy]).
    "types-jsonschema",
    "types-psutil",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
bioflow = "bioflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["bioflow"]

# Bundle the tool registry + presets into the wheel so `pip install bioflow`
# (no git checkout) still has a working registry.  At runtime,
# bioflow.core.registry.default_registry_dir() prefers ./registry in the
# CWD (dev / git clone) and falls back to this bundled copy.
[tool.hatch.build.targets.wheel.force-include]
"registry" = "bioflow/_bundled_registry"

[tool.ruff]
line-length = 100
# Match requires-python (>=3.9).  Previously "py311", which let ruff's
# pyupgrade rules rewrite annotations to 3.10/3.11-only syntax (PEP 604
# `X | None`, `datetime.UTC`) that crashes at *import* time on 3.9 — Pydantic
# models and Typer commands resolve annotations via get_type_hints(), even
# under `from __future__ import annotations`, so lazy stringified annotations
# don't save us.
target-version = "py39"

[tool.ruff.lint]
# bioflow still supports Python 3.9 (see requires-python).  PEP 604 unions
# (`X | None`, `X | Y`) are only valid at *runtime* on 3.10+, and Pydantic
# models / Typer commands resolve annotations via get_type_hints() at import
# — even under `from __future__ import annotations` — so a stringified
# `X | None` still raises TypeError on 3.9.  Keep typing.Optional/Union until
# the 3.9 floor is raised, then delete this block and re-run `ruff check .`.
# (PEP 585 builtins like list[x] / dict[x] ARE 3.9-safe and have been adopted.)
ignore = [
    # --- Python 3.9 support (see requires-python) --------------------------
    "UP007",  # non-pep604-annotation-union     (Union[x, y] -> x | y)
    "UP045",  # non-pep604-annotation-optional  (Optional[x] -> x | None)
    # --- Intentional patterns for a Docker/subprocess orchestration CLI ----
    # bioflow shells out to containers and drives optional native deps
    # (pynvml), the Docker SDK, LLM HTTP APIs and the filesystem.  A broad
    # `except Exception` that logs-and-degrades is the deliberate design at
    # those boundaries; narrowing 60+ call-sites would risk letting a new
    # error type crash a long pipeline.  The best-effort cleanup that swallows
    # silently (container.remove() on the error path, config-load fallbacks)
    # is the same call.
    "BLE001",  # blind-except
    "S110",    # try-except-pass      (best-effort cleanup)
    "S112",    # try-except-continue  (best-effort cleanup)
    # Naive datetimes here are human-facing LOCAL timestamps — report headers,
    # CHANGELOG dates, file-mtime freshness — never serialized or compared
    # across timezones, so tz-aware would only add noise.
    "DTZ005",  # datetime.now() without tz
    "DTZ006",  # datetime.fromtimestamp() without tz
    "DTZ011",  # date.today()
]

# Typer's whole API is `param: T = typer.Option(...)` / `typer.Argument(...)`,
# i.e. a function call in an argument default — exactly what B008 forbids.
# These calls are immutable sentinels, not shared mutable state, so treat them
# as immutable rather than sprinkling `# noqa: B008` on every CLI signature.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Examples are standalone scripts — sys.path manipulation before imports is intentional
"examples/*.py" = ["E402", "E701"]
# Tests use inline semicolons as a compact setup style, unpack tuples they only
# partially assert on, use mutable class attrs as fixtures, and exec generated code.
"tests/**/*.py" = ["E702", "E701", "F841", "RUF059", "RUF012", "S102", "SIM102"]
# test_benchmark imports update/ modules after a runtime sys.path.insert, so its
# import block is deliberately ordered (path shim first) and can't be sorted.
"tests/unit/test_benchmark.py" = ["I001"]

[tool.mypy]
# Type-check as the supported floor (see requires-python), not the runner's
# interpreter, so use of 3.10+ stdlib APIs is caught.
python_version = "3.9"
# Check the bodies of un-annotated functions too — that's where the real bugs
# hide (it surfaced a bad `except <untyped tuple>` and a docker.types access).
check_untyped_defs = true

# The Docker / Anthropic / OpenAI SDKs are shelled-out optional deps that may
# be absent in a dev env and aren't type-checked here — exempt just those, so
# everything else (incl. jsonschema / psutil / pandas via installed stubs) is
# checked for real instead of a blanket --ignore-missing-imports.
[[tool.mypy.overrides]]
module = ["docker.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: marks tests that require a running Docker daemon (deselect with '-m not docker')",
    "slow: marks tests that take a long time to run",
]
